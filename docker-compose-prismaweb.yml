services:
  prismaweb:
    image: ${PRISMA_WEB_IMAGE:-gurudohimalaia/prismaweb}:${PRISMA_WEB_TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${PRISMA_WEB_TAG:-local}
    container_name: PrismaWeb

    restart: always

    ports:
      - "${PRISMA_WEB_PORT:-8080}:8080"

    environment:
      PRISMA_API_URL: ${PRISMA_API_URL:-http://localhost:9017/PrismaAPI/v1}
